<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fito Agents Widget Test</title>
    <style>
        body {
            background-color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #18181b;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 1.5rem;
            shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 { font-weight: 800; letter-spacing: -0.025em; }
        p { color: #71717a; line-height: 1.6; }
        .badge {
            display: inline-block;
            background: #e4e4e7;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Local Testing</span>
        <h1>Fito Agents Embed Test</h1>
        <p>This is a simulated external website. The Fito Agents chat widget should appear in the bottom corner of the screen.</p>
        <p>Make sure to replace <code>YOUR_AGENT_ID</code> in the script tag below with a real agent ID from your dashboard.</p>
    </div>

    <!-- FITO AGENTS WIDGET START -->
    <script 
        src="http://localhost:3000/embed.js" 
        data-agent-id="REPLACE_WITH_REAL_AGENT_ID"
        data-position="bottom-right"
    ></script>
    <!-- FITO AGENTS WIDGET END -->
</body>
</html>
