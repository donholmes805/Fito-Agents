<style>
        body {
            background-color: #020617; /* Surface Black as per Level 0 */
        }
        .glass-panel {
            background: #0F172A; /* Deep Navy Level 1 */
            border: 1px solid #1E293B;
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.4);
        }

            background: linear-gradient(to bottom, #0356ff, #0039b3);

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center p-gutter relative overflow-hidden">
<div class="absolute inset-0 z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary/5 blur-[120px]"></div>
</div>
<div class="relative z-10 w-full max-w-[480px]">
<div class="glass-panel rounded-2xl p-stack-lg md:p-12">
<div class="flex flex-col items-center mb-stack-lg">
<div class="flex items-center gap-unit mb-stack-md">
<span class="material-symbols-outlined text-secondary-container text-4xl" data-icon="smart_toy">smart_toy</span>

</div>

<div class="space-y-stack-sm">

<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all outline-none" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps uppercase text-on-surface-variant" for="password">Password</label>
<a class="font-label-caps text-label-caps text-secondary-container hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-12 text-on-surface placeholder:text-outline focus:border-secondary-container focus:ring-1 focus:ring-secondary-container transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center space-x-3 py-unit">
<div class="relative flex items-center h-5">
<input class="h-5 w-5 rounded border-outline-variant bg-surface-container-lowest text-secondary-container focus:ring-secondary-container focus:ring-offset-background" id="remember" name="remember" type="checkbox"/>
</div>
<label class="font-body-md text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<button class="w-full primary-gradient text-white font-h3 text-body-md py-4 rounded-lg shadow-xl shadow-black/20 transition-all active:scale-[0.98] mt-stack-md" type="submit">
                        Login to Workspace
                    </button>
</form>
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant/30 text-center">
<p class="font-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-secondary-container font-semibold hover:underline ml-unit" href="#">Register Now</a>
</p>
</div>
</div>
<div class="mt-stack-lg flex justify-center space-x-stack-md opacity-40 hover:opacity-100 transition-opacity">
<a class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant hover:text-white" href="#">System Status</a>
<span class="text-outline">•</span>
<a class="font-label-caps text-label-caps uppercase tracking-widest text-on-surface-variant hover:text-white" href="#">API Docs</a>
